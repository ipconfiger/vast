# VAST Bot Connector — configuration TEMPLATE
# =============================================================================
# This is a template. To use it:
#   1. Copy to bot-connector.yaml (which is gitignored):
#        cp tools/bot-connector.example.yaml tools/bot-connector.yaml
#   2. Fill in your real values, OR reference environment variables with
#      ${VAR} syntax, e.g.  api_key: "${OPENAI_API_KEY}"
#      The connector expands ${VAR} against your environment before parsing.
#   3. Run:
#        python3 bot-connector.py --config bot-connector.yaml
# =============================================================================

# -- VAST server connection ---------------------------------------------------
vast:
  # The WebSocket URL of your VAST instance.  Must include the scheme (ws://
  # or wss:// for TLS).  The connector appends /ws/bot automatically.
  url: "ws://localhost:3000/ws/bot"

  # Seconds to wait before reconnecting after a disconnect.
  reconnect_interval: 5


# -- Bot definitions ----------------------------------------------------------
# You can define multiple bots here; each runs in its own persistent connection
# loop.  Every bot MUST have a connection_key from the VAST admin panel.
#
# To get a connection_key:
#   1. Log into the VAST admin panel
#   2. Go to Bots → Create Bot
#   3. Select "Connection Mode: Connector"
#   4. Copy the connection key shown after creation
#   5. Paste it as the connection_key value below
#
bots:
  # ── Example: local Ollama ─────────────────────────────────────────────────
  # - connection_key: "your-uuid-here"
  #   llm:
  #     url: "http://localhost:11434/v1"      # Ollama default
  #     model: "qwen2.5:7b"
  #     api_key: ""                            # Ollama doesn't need one
  #     timeout: 120                           # seconds for LLM response
  #   system_prompt: "你是一个友好的中文技术助手，请用简洁的中文回复。"

  # ── Example: OpenAI ───────────────────────────────────────────────────────
  # - connection_key: "your-uuid-here"
  #   llm:
  #     url: "https://api.openai.com/v1"
  #     model: "gpt-4o-mini"
  #     api_key: "sk-your-api-key"
  #     timeout: 60

  # ── Example: vLLM (self-hosted) ───────────────────────────────────────────
  # - connection_key: "your-uuid-here"
  #   llm:
  #     url: "http://192.168.1.100:8000/v1"
  #     model: "meta-llama/Llama-3.1-8B-Instruct"
  #     api_key: ""
  #     timeout: 120

  # ── Example: Hermes Agent (local) ─────────────────────────────────────────
  # - connection_key: "your-uuid-here"
  #   llm:
  #     url: "http://localhost:4891/v1"        # Hermes Agent default port
  #     model: "hermes"
  #     api_key: ""
  #     timeout: 180

  # ── Your bot(s) below ─────────────────────────────────────────────────────
  # - connection_key: ""
  #   llm:
  #     url: "http://localhost:11434/v1"
  #     model: "qwen2.5:7b"
  #     api_key: ""
  #     timeout: 120
  #   system_prompt: ""
